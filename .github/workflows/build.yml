name: Build and Release

on:
  push:
    branches:
      - x221Mod
      - x221Mod_qt6
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        default: ''

permissions:
  contents: write

env:
  VARIANT: '_qt6'
  QT_VERSION: '6.10.3'
  QT_32BIT_URL: 'https://dl.iloli.one/qt6/Qt_6.10.3_msvc22_32bit.7z'
  QT_32BIT_SHA256: '5865677338b54fb59707afb44393c0a105010c0e32af9dc6c00531714b6da294'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v143 (VS2022)
            toolset: v143
            suffix: ''

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: Textractor

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.release_tag }}' -ne '') {
            $base = '${{ github.event.inputs.release_tag }}' -replace '^v', ''
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $base = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = Get-Date -Format 'yyMMdd'
          }
          $variant = $env:VARIANT
          if ($variant -and $base.Contains($variant)) { $variant = '' }
          $version = $base + $variant + '${{ matrix.suffix }}'
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "APP_VERSION = $version"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt
          key: qt6-${{ env.QT_VERSION }}-msvc2022-v1

      - name: Install aqtinstall & Qt ${{ env.QT_VERSION }}
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir C:\Qt -m qt5compat qtwebsockets
          $archive = "$env:TEMP\qt6-x86.7z"
          Invoke-WebRequest -Uri $env:QT_32BIT_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:QT_32BIT_SHA256) { throw "Qt 32bit hash mismatch" }
          7z x $archive "-oC:\Qt\$env:QT_VERSION\" -y

      - name: Copy Translation Files
        shell: pwsh
        run: |
          $langs = @('zh_CN', 'pt_BR', 'tr')
          foreach ($qtDir in @("C:\Qt\$env:QT_VERSION\msvc2022", "C:\Qt\$env:QT_VERSION\msvc2022_64")) {
            New-Item -ItemType Directory -Force -Path "$qtDir\translations" | Out-Null
            foreach ($lang in $langs) {
              Copy-Item "$env:GITHUB_WORKSPACE\Textractor\languages\qtbase_$lang.qm" "$qtDir\translations\" -Force
            }
          }

      - name: Build x86 and x64
        shell: cmd
        run: |
          set "SRC=%GITHUB_WORKSPACE%\Textractor"
          if not exist "%GITHUB_WORKSPACE%\build\x86" mkdir "%GITHUB_WORKSPACE%\build\x86"
          if not exist "%GITHUB_WORKSPACE%\build\x64" mkdir "%GITHUB_WORKSPACE%\build\x64"

          cd /d "%GITHUB_WORKSPACE%\build\x86"
          cmake -G "Visual Studio 17 2022" -A Win32 -T ${{ matrix.toolset }} -DQt6_DIR="C:\Qt\%QT_VERSION%\msvc2022\lib\cmake\Qt6" -DCMAKE_BUILD_TYPE=Release -DVERSION=%APP_VERSION% "%SRC%"
          if errorlevel 1 exit /b 1
          cmake --build . --config Release -j 1
          if errorlevel 1 exit /b 1

          cd /d "%GITHUB_WORKSPACE%\build\x64"
          cmake -G "Visual Studio 17 2022" -A x64 -T ${{ matrix.toolset }} -DQt6_DIR="C:\Qt\%QT_VERSION%\msvc2022_64\lib\cmake\Qt6" -DCMAKE_BUILD_TYPE=Release -DVERSION=%APP_VERSION% "%SRC%"
          if errorlevel 1 exit /b 1
          cmake --build . --config Release -j 1
          if errorlevel 1 exit /b 1

      - name: Package Artifacts
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $builds = "$root\Textractor\builds"
          $pkg = "$root\pkg"

          Remove-Item -Recurse -Force $pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$pkg\x86", "$pkg\x64" | Out-Null
          Copy-Item "$builds\Release_x86\*" "$pkg\x86\" -Recurse -Force
          Copy-Item "$builds\Release_x64\*" "$pkg\x64\" -Recurse -Force
          Copy-Item "$root\Textractor\INSTALL_THIS_UNICODE_FONT.ttf" "$pkg\" -Force
          Copy-Item "$root\Textractor\GUI\icon\LICENSE-icons.txt" "$pkg\x86\" -Force
          Copy-Item "$root\Textractor\GUI\icon\LICENSE-icons.txt" "$pkg\x64\" -Force

          $junk = Get-ChildItem $pkg -Recurse -File | Where-Object { $_.Extension -in @('.exp', '.lib') }
          $junk | Remove-Item -Force
          Write-Host "stripped $($junk.Count) .lib/.exp files"

          7z a -mx9 "$root\Textractor_$($env:APP_VERSION).7z" "$pkg\*"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -Recurse -Force $pkg

          $hookDir = "$root\hook"
          New-Item -ItemType Directory -Force -Path "$hookDir\x86", "$hookDir\x64" | Out-Null
          Copy-Item "$builds\Release_x86\texthook.dll" "$hookDir\x86\" -Force
          Copy-Item "$builds\Release_x64\texthook.dll" "$hookDir\x64\" -Force
          7z a -mx9 "$root\texthook_$($env:APP_VERSION).7z" "$hookDir\*"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -Recurse -Force $hookDir

      - name: Upload Textractor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Textractor_${{ steps.ver.outputs.version }}
          path: Textractor_*.7z
          if-no-files-found: error

      - name: Upload texthook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: texthook_${{ steps.ver.outputs.version }}
          path: texthook_*.7z
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -l

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Textractor ${{ github.event.inputs.release_tag || github.ref_name }}"
          files: |
            Textractor_*.7z
            texthook_*.7z
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}